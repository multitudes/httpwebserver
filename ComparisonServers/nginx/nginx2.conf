# filepath: /etc/nginx/nginx.conf
user  www;
# number of concurrent connections typically the number of CPU cores
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  5;

    server {
        listen       4244;
        server_name  localhost;

		root /var/www/html;
		
        # Add client body size limit for file uploads
        client_max_body_size 10M;
        
        location / {
            index  index.html index.htm;
        }

        # Add redirection from /go to /here
        location /go {
            return 301 /here;
        }
        
        # Your target location
        location /here {
            index index.html;
        }

		# cgi will not work in this configuration
        location /upload {
            # Ensure only POST requests are allowed
            acceptedMethods POST {
                deny all;
            }
            
            # # Your server will handle the actual file processing
            # proxy_pass http://localhost:4244;
            # proxy_set_header X-Real-IP $remote_addr;
        }

        # Location to serve uploaded files
        location /uploads {
            # Uploads will be in /var/www/html/uploads
            alias /var/www/html/uploads;
            autoindex off;  # For security, disable directory listing
            
            # Only allow specific file types
            location ~* \.(jpg|jpeg|png|gif|pdf|txt)$ {
                try_files $uri =404;
            }
            
            # Deny access to all other files
            location ~ .* {
                deny all;
            }
        }
		
        # Add CGI handling
        location /cgi-bin/ {
            gzip off;
            fastcgi_pass unix:/var/run/fcgiwrap.sock;  # FastCGI handler
            fastcgi_index index.cgi;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_script_name;
        }
		
        error_page 400 /error_pages/400.html;
        location = /error_pages/400.html {
        }

        error_page 403 /error_pages/403.html;
        location = /error_pages/403.html {
        }

        error_page 404 /error_pages/404.html;
        location = /error_pages/404.html {
        }

        error_page 405 /error_pages/405.html;
        location = /error_pages/405.html {
        }

		error_page 502 /error_pages/502.html;
		location = /error_pages/502.html {
        }

        error_page  500 503 504  /50x.html;
        location = /50x.html {
        }
    }
}