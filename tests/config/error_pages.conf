http {
	# Global settings
	maxBodySize 100000000; mandatory 

    
    server {
        listen 4244;

        server_name myWebserver someWebserver;
        root htmltest/www1/;

        # Error pages - might be added by user or not - if not i have a default
        error_page {
            400 www/error_pages/400.html
            403 www/error_pages/403.html
            404 www/error_pages/404.html
            405 www/error_pages/405.html
            418 www/error_pages/418.html
            500 www/error_pages/500.html
            502 www/error_pages/502.html
        }

    }

    # Second server without custom error pages
    server {
        listen 4245;
        server_name myWebserver2 someWebserver2;
        root ./htmltest/www2/;
    }

}