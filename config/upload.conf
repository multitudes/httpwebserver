http {
    # Global settings for upload-focused server
    maxBodySize 104857600;   # 100MB limit for large uploads
    autoindex on;
    
    # Error pages
    error_page {
        400 www/error_pages/400.html
        403 www/error_pages/403.html
        404 www/error_pages/404.html
        405 www/error_pages/405.html
        413 www/error_pages/413.html  # Request entity too large
        500 www/error_pages/500.html
        502 www/error_pages/502.html
    }
    
    # Main upload server
    server {
        listen 9000;
        server_name upload.example.com;
        root html/www1;
        
        # Root location - upload form
        location / {
            # For the upload form only
        }
        
        # Handle uploads
        location /uploads {
            file_upload on;
            upload_dir www/storage/media;
            acceptedMethods POST PUT {
                deny all;
            }
        }
        
        # Image uploads
        location /uploads/images {
            file_upload on;
            upload_dir www/storage/images;
            acceptedMethods POST PUT {
                deny all;
            }
            # Limit to image types in a real implementation
        }
        
        # Document uploads
        location /uploads/docs {
            file_upload on;
            upload_dir www/storage/documents;
            acceptedMethods POST PUT {
                deny all;
            }
        }
        
        # Serve uploaded content
        location /media {
            alias www/storage;
            autoindex on;
            acceptedMethods GET HEAD;
        }
        
        # Admin interface with limited access
        location /admin {
            internal;
        }
    }
    
    # Server for previewing uploaded content
    server {
        listen 9001;
        server_name preview.example.com;
        root www/storage;
        
        # Serve files with directory listing
        location / {
            autoindex on;
            acceptedMethods GET HEAD;
        }
    }
}