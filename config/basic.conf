http {
    # Global settings
    maxBodySize 10485760;    # 10MB max body size
    maxConnections 100;
    requestTimeout 30;       # Short timeouts for better performance
    responseTimeout 30;
    keepalive_timeout 60;
    autoindex off;           # Don't show directory listings by default
    
    # Global error pages
    error_page {
        400 www/error_pages/400.html
        403 www/error_pages/403.html
        404 www/error_pages/404.html
        405 www/error_pages/405.html
        418 www/error_pages/418.html
        500 www/error_pages/500.html
        502 www/error_pages/502.html
    }
    
    # Main server - static content
    server {
        listen 8080;
        server_name localhost static.example.com;
        root html/www1;
        
        # Basic location for direct access
        location / {
            autoindex off;
            # Default location serves static files
        }
        
        # Enable directory listing for specific directory
        location /downloads {
            autoindex on;
        }
        
        # Protect private files
        location /private {
            acceptedMethods GET {
                deny all;
            }
            internal;
        }
        
        # Handle redirections
        location /old-page {
            redirect /new-page;
        }
        
        # External redirect
        location /external {
            redirect https://example.com/;
        }
    }
    
    # Virtual host for API
    server {
        listen 8081;
        server_name api.example.com;
        root html/api;
        
        # API requests with limited methods
        location /api/v1 {
            acceptedMethods GET POST {
                deny all;
            }
        }
    }
}