http {
	# Global settings
	maxBodySize 100000000; mandatory 

    # Error pages - might be added by user or not - if not i have a default
    error_page {
        400 www/error_pages/400.html
        403 www/error_pages/403.html
        404 www/error_pages/404.html
        405 www/error_pages/405.html
        418 www/error_pages/418.html
        500 www/error_pages/500.html
        502 www/error_pages/502.html
    }
    
    server {
        listen 4244;
       # listen 4271;
        server_name myWebserver someWebserver;
        root html/www1/;
        

        

        location /some/directory/ { 
            
            file_upload on;
        }
        # TODO
        # Define a directory or a file from where the file should be searched (for example, if url /kapouet is rooted to /tmp/www, url /kapouet/pouic/toto/pouet is /tmp/www/pouic/toto/pouet).

        # Directive/Location blocks
        # redirection
        location /42 {
            #return 301 http://42berlin.de/;
            redirect http://42berlin.de/;
        }

        location /43 {
           autoindex on;
        }

        # redirection
        location /go {
            #return 301 /here/index.html;
            redirect /here/index.html;
        }

        location /here {
            acceptedMethods GET POST DELETE {
                deny all;
            }
            internal;
        }
        # redirection /uploads/mydir -> www/http/mydir
        location /uploads {
            
            file_upload on;
        }

        # CGI Configuration localhost:4244/cgi/test.cgi
        cgi {
            cgi_path_alias /cgi "/cgi-bin"
            upload_dir www/uploads
            file_extension .cgi .py
            acceptedMethods GET POST DELETE
            {
                deny all;
            }
        }


        # location /images {
        #     acceptedMethods GET POST DELETE PUT {
        #         deny all;
        #     }
        #     file_upload on;
        #     file_upload_path /tmp/uploads;
        # }
    }

    # Second server
    server {
        listen 4246;
        server_name myWebserver2 someWebserver2;
        root ./www2;
    }

    # Third server
    server {
        listen 4247;
        server_name myWebserver someWebserver;
		root ./www/html;
    }

# ignored
    server {
        listen 4270;
        server_name myWebserver someWebserver;
        root ./www/html;
    }
}