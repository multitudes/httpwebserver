http {
    # Global settings
    maxBodySize 52428800;     # 50MB
    maxConnections 200;
    requestTimeout 60;
    responseTimeout 60;
    keepalive_timeout 120;
    autoindex off;
    
    # Error pages
    error_page {
        400 www/error_pages/400.html
        403 www/error_pages/403.html
        404 www/error_pages/404.html
        405 www/error_pages/405.html
        418 www/error_pages/418.html
        500 www/error_pages/500.html
        502 www/error_pages/502.html
    }
    
    # Main web server with CGI support
    server {
        listen 80;
        listen 8000;
        server_name example.com www.example.com;
        root html/public;

        
        # Static file serving
        location / {
            autoindex off;
        }
        
        # CGI scripts
        cgi {
            cgi_path_alias /cgi-bin "/cgi-bin"
            upload_dir www/uploads/cgi
            file_extension .cgi .py .pl
            acceptedMethods GET POST DELETE{
                deny all;
            }
        }
        
        # File uploads
        location /upload {
            file_upload on;
            upload_dir www/uploads;
        }
        
        # API endpoints with CGI backend
        location /api {
            acceptedMethods GET POST PUT DELETE {
                deny all;
            }
            # CGI will process these requests
        }
        
        # Static assets like CSS, JS
        location /assets {
            alias html/assets;
            autoindex off;
        }
        
        # Multiple redirects
        location /blog {
            redirect /articles;
        }
        
        location /contact {
            redirect https://forms.example.com/contact;
        }
        
        # Location with custom error page
        location /beta {
            error_page {
                404 www/beta/not-found.html
            }
        }
    }
    
    # Admin server on different port
    server {
        listen 8888;
        server_name admin.example.com;
        root html/admin;
        
        location / {
            # Admin panel
            internal;
        }
        
        # Server status
        location /status {
            internal;
        }
    }
    
    # Testing/Development server
    server {
        listen 8080;
        server_name dev.example.com;
        root html/development;
        
        # Allow directory listing for development
        location / {
            autoindex on;
        }
        
        # Test CGI scripts
        cgi {
            cgi_path_alias /test-cgi "/cgi-bin/test"
            upload_dir www/dev/uploads
            file_extension .cgi .py .pl .php
            acceptedMethods GET POST PUT DELETE {
                deny all;
            }
        }
    }
}